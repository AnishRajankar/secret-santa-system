services:
  - type: web
    name: secret-santa-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false        # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_HTTP_ONLY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"      # HTTPS in production
      - key: MIN_PARTICIPANTS
        value: "3"
